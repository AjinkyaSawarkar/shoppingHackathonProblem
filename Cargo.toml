[package]
name = "sess"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow-array = "57"
arrow-schema = "57"
parquet = { version = "57", default-features = false, features = ["arrow"] }
memmap2 = "0.9"
rayon = "1.10"
memchr = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
